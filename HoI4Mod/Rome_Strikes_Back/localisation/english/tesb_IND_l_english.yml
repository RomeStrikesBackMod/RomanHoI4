 #events
 tesb_india.2.t:0 "Hindustan Announces Mandala Democratic League"
 tesb_india.2.desc:0 "It appears that the Empire of Hindustan, after spending the last two years presiding over internal reforms, is once again looking outward. Badshah Ventkatadri I and Peshwa Uyyalawada Kattabomman have long been known as patrons of democratic movements within India, and now they seek to extend that patronization overseas. In a speech earlier today, Ventkatadri I announced the formation of the Mandala Democratic League, a military and economic bloc founded on common principles of democracy and human rights. Many democratic nations on the Indian Ocean have already signaled their willingness to begin negotiations, while democratic organizations in non-democratic nations in Southeast Asia have surged in membership and morale, concerning Zhu Wei and the architects of his GACPS."
 tesb_india.2.a:0 "Another pillar of democracy arises in the east."
 tesb_india.10.t:0 "Join Mandala Democratic League"
 tesb_india.10.desc:0 "India has invited us to join the Mandala Democratic League. Should we?"
 tesb_india.10.a:0 "Join"
 tesb_india.10.a:0 "Refuse"
 tesb_india.11.t:0 "[From.GetName] Joins"
 tesb_india.11.d:0 "[From.GetName] has agreed to join the Mandala Democratic League."
 tesb_india.11.a:0 "Good"
 tesb_india.12.t:0 "[From.GetName] Refused"
 tesb_india.12.d:0 "[From.GetName] has declined to join the Mandala Democratic League."
 tesb_india.12.a:0 "Allow It"
 tesb_india.12.b:0 "Force Them"
 tesb_india.20.t:0 "India Proposes Freeing [PEG.GetName]"
 tesb_india.20.d:0 "India proposes that we release [PEG.GetName] into their control. Southeast Asia is distant and outside our sphere of influence. Should we agree to this proposal?"
 tesb_india.20.a:0 "Refuse"
 tesb_india.20.b:0 "Agree"
 tesb_india.21.t:0 "Russia Refused to Free [PEG.GetName]"
 tesb_india.21.d:0 "Russia has refused to free [PEG.GetName], we must fight for their freedom."
 tesb_india.21.a:0 "To war!"
 tesb_india.22.t:0 "Russia Freed [PEG.GetName]"
 tesb_india.22.d:0 "Russia has freed [PEG.GetName], which will now come under our leadership."
 tesb_india.22.a:0 "Good"
 tesb_india.23.t:0 "Join India"
 tesb_india.23.d:0 "Russia has freed us, we will now pass into India's leadership."
 tesb_india.23.a:0 "Okay"
 tesb_india.24.t:0 "Leadership Over [PEG.GetName]"
 tesb_india.24.d:0 "[PEG.GetName] has now come under our leadership."
 tesb_india.24.a:0 "Good"
 tesb_india.25.t:0 "Uniting [PEG.GetName] and [BUR.GetName]"
 tesb_india.25.d:0 "India promulgated a plan to reunite [PEG.GetName] and [BUR.GetName]. From now on we will be one nation."
 tesb_india.25.a:0 "Good"
 tesb_india.26.t:0 "Uniting [PEG.GetName] and [BUR.GetName]"
 tesb_india.26.d:0 "India promulgated a plan to reunite [PEG.GetName] and [BUR.GetName]. From now on we will be one nation."
 tesb_india.26.a:0 "Good"
 tesb_india.30.t:0 "[IND.GetName] Proposes deomcracy"
 tesb_india.30.d:0 "India proposes that we reform our government to a democratic form. Should we?"
 tesb_india.30.a:0 "Refuse"
 tesb_india.30.b:0 "Agree"
 tesb_india.31.t:0 "[SUK.GetName] Refused to Change Government"
 tesb_india.31.d:0 "[SUK.GetName] has refused to change government and give their people a voice, we must fight for their freedom."
 tesb_india.31.a:0 "To war!"
 tesb_india.32.t:0 "Join India"
 tesb_india.32.d:0 "We have changed governments and will now follow India's leadership."
 tesb_india.32.a:0 "Okay"
 tesb_india.33.t:0 "Leadership Over [SUK.GetName]"
 tesb_india.33.d:0 "[SUK.GetName] has now come under our leadership."
 tesb_india.34.t:0 "Uniting [SUK.GetName] and [SIA.GetName]"
 tesb_india.34.d:0 "India promulgated a plan to reunite [SUK.GetName] and [SIA.GetName]. From now on we will be one nation."
 tesb_india.34.a:0 "Good"
